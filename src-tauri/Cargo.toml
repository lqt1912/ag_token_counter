[package]
name = "ag-token-counter"
version = "1.0.0"
description = "Real-time AI Token Analytics in Rust with Tauri v2"
authors = ["AI Token Analytics Team"]
edition = "2021"

[lib]
name = "ag_token_counter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
walkdir = "2"
dirs = "5"
tokio = { version = "1", features = ["full"] }
